name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch compile-only libraries
        shell: pwsh
        run: ./tools/fetch-libs.ps1

      - name: Build
        shell: pwsh
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: stressroutes-jar
          path: build/libs/*.jar
          if-no-files-found: error
